identity:
  bot_login: specster-endika[bot]
budget:
  max_usd_per_issue: 2.0
  max_usd_per_build: 1.5
build:
  tools: {node: "22"}
  setup_command: [npm, ci]
  test_command: [npm, run, test:run]
  preview:
    serve_command: [sh, -c, "export VITE_BASE_PATH=/ && npm run build && exec npx vite preview --host 127.0.0.1 --port 4173 --strictPort"]
    ready_url: http://127.0.0.1:4173/
    ready_timeout_s: 180
