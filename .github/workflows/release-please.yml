name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Enable GitHub native auto-merge on the release PR and stop. GitHub waits
      # for the required checks (quality/test/build) and rebase-merges when they
      # go green. That merge is a push to main by RELEASE_PLEASE_TOKEN (a PAT),
      # which re-triggers this workflow so release-please creates the tag and the
      # GitHub release on the follow-up run. The release branch is cleaned up by
      # the "Delete closed PR branch" workflow after the merge.
      #
      # Do NOT wait-then-delete-then-redispatch here: enabling auto-merge returns
      # immediately, so a short wait would delete the branch before the checks
      # finish, cancelling the merge, closing the PR and self-dispatching into an
      # infinite create/close loop. If auto-merge cannot complete, the PR simply
      # stays open awaiting checks -- the safe outcome.
      - if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: gh pr merge --rebase --auto -R "$REPO" "$(echo "$PR_JSON" | jq -r .number)"

      # When a release is actually published, redeploy from main so the live
      # build carries the bumped version. release-please's own version-bump
      # commit is pushed by GITHUB_TOKEN and does NOT trigger the on:push deploy,
      # so the site would otherwise stay one release behind.
      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml -R "$REPO" --ref main
