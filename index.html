<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6366f1" />
    <meta
      name="description"
      content="ConvertHub: PWA for converting currencies, units and sizes. Offline-first, multi-language, open source."
    />
    <meta name="author" content="ConvertHub Contributors" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="dns-prefetch" href="https://api.exchangerate-api.com" />
    <link
      rel="preconnect"
      href="https://api.exchangerate-api.com"
      crossorigin
    />

    <title>ConvertHub — Convert Offline</title>

    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #app {
        min-height: 100vh;
        background: #0f172a;
        color: #e2e8f0;
      }
      noscript {
        display: block;
        padding: 2rem;
        background: #7c3aed;
        color: white;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="app-loading" role="status" aria-live="polite">
        <p>Loading…</p>
      </div>
    </div>

    <noscript>
      <h1>ConvertHub requires JavaScript</h1>
      <p>Please enable JavaScript to use this application.</p>
    </noscript>

    <script type="module" src="src/main.ts"></script>
  </body>
</html>
