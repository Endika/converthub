<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <!-- Meta Tags -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6366f1" />
    <meta
      name="description"
      content="ConvertHub: Professional PWA for converting currencies, units, and sizes. Offline-first, multi-language, open source."
    />
    <meta
      name="keywords"
      content="converter, currency, units, offline, pwa, travel, typescript, ddd"
    />
    <meta name="author" content="ConvertHub Contributors" />
    <meta name="license" content="MIT" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🔄 ConvertHub" />
    <meta
      property="og:description"
      content="Convert currencies, units, and sizes offline. No ads, multi-language, open source."
    />
    <meta property="og:url" content="https://converthub.io" />
    <meta property="og:site_name" content="ConvertHub" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🔄 ConvertHub" />
    <meta
      name="twitter:description"
      content="Professional PWA for converting currencies, units, and sizes"
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
      sizes="180x180"
    />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://api.exchangerate-api.com"
      crossorigin
    />

    <!-- Fonts (system fonts, no external loading for performance) -->
    <link rel="preload" as="style" href="/styles/fonts.css" />

    <!-- DNS Prefetch for APIs -->
    <link rel="dns-prefetch" href="https://api.exchangerate-api.com" />

    <!-- Title -->
    <title>ConvertHub — Convert Offline</title>

    <!-- Loading style (inline para evitar FOUC) -->
    <style>
      html {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Loading skeleton */
      #app {
        min-height: 100vh;
        background: #0f172a;
        color: #e2e8f0;
      }

      /* No JavaScript fallback */
      noscript {
        display: block;
        padding: 2rem;
        background: #7c3aed;
        color: white;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- App Root -->
    <div id="app">
      <!-- Loading state -->
      <div class="app-loading" role="status" aria-live="polite">
        <p>Loading...</p>
      </div>
    </div>

    <!-- No JavaScript fallback -->
    <noscript>
      <h1>ConvertHub requires JavaScript</h1>
      <p>Please enable JavaScript to use this application.</p>
    </noscript>

    <!-- Main App Bundle -->
    <script type="module" src="/src/main.ts"></script>

    <!-- Service Worker Registration -->
    <script>
      // Register Service Worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/src/sw.ts', { scope: '/' })
            .then((registration) => {
              console.log('✅ Service Worker registered:', registration);

              // Check for updates periodically (24h)
              setInterval(() => {
                registration.update();
              }, 24 * 60 * 60 * 1000);
            })
            .catch((error) => {
              console.error('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>

    <!-- Performance monitoring (optional) -->
    <script>
      // Log performance metrics
      if ('PerformanceObserver' in window) {
        try {
          const observer = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
              console.log(
                `⏱️ ${entry.name}: ${Math.round(entry.duration)}ms`
              );
            }
          });

          observer.observe({
            entryTypes: [
              'navigation',
              'resource',
              'paint',
              'largest-contentful-paint',
            ],
          });
        } catch (e) {
          // Ignore if not supported
        }
      }
    </script>
  </body>
</html>
